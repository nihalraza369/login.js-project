<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Premium Login</title>
  <link rel="stylesheet" href="style12.css" />
  <script defer src="script12.js"></script>
</head>
<body>
  <div class="wrapper">
    <div class="left-panel">
      <h1>Welcome Back!</h1>
      <p>Enter your login credentials and continue your learning journey.</p>
      <img src="https://cdn-icons-png.flaticon.com/512/4203/4203610.png" alt="Login Icon" />
    </div>
    <div class="right-panel">
      <form id="loginForm" class="login-form">
        <h2>Login</h2>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@gmail.com" required />
          <small class="error" id="emailError"></small>
        </div>
        <div class="input-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Your password" required />
            <span id="togglePassword">👁️</span>
          </div>
          <small class="error" id="passError"></small>
        </div>
        <div class="extra">
          <label><input type="checkbox" /> Remember Me</label>
          <a href="#">Forgot Password?</a>
        </div>
        <button type="submit">Log In</button>
        <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
      </form>
    </div>
  </div>
</body>
</html>
